name: Verify Action
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Make sure dist is generated from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rm -rf dist/
      - run: npm clean-install
      - run: npm test
      # verify that commit dist directory is exactly the same one generated from source
      - run: npm run build
      - run: git diff --exit-code
      - run: git status --porcelain && test -z "$(git status --porcelain)"
  build-magento:
    name: ${{ format('Builds Magento Artifact ({0}-{1})', matrix.magento-version, case(fromJSON(matrix.sample-data), 'with sample data', 'without sample data') ) }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample-data: ['true', 'false']
        magento-version: ['2.4.9', '2.4.8-p5', '2.4.7-p10']
        include:
          - magento-version: '2.4.9'
            php-version: '8.5'
            mariadb-version: '11.8'
            opensearch-version: '3.0'
          - magento-version: '2.4.8-p5'
            php-version: '8.3'
            mariadb-version: '11.4'
            opensearch-version: '3.0'
          - magento-version: '2.4.7-p10'
            php-version: '8.2'
            mariadb-version: '10.11'
            opensearch-version: '2.19'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          magento-version: ${{ matrix.magento-version }}
          php-version: ${{ matrix.php-version }}
          mariadb-version: ${{ matrix.mariadb-version }}
          opensearch-version: ${{ matrix.opensearch-version }}
          sample-data: ${{ matrix.sample-data }}
          name: ${{ case(fromJSON(matrix.sample-data), format('{0}-sampledata',matrix.magento-version), matrix.magento-version) }}
  verify-artifact:
    name: Verify artifact from build
    needs: build-magento
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p verify-artifact
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          skip-decompress: 'true'
          path: ./verify-artifact
      - name: Verify artifact is created
        run: |
          shopt -s nullglob
          archives=(./verify-artifact/**/*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No artifact archives found!"
            exit 1z
          fi
          for archive in "${archives[@]}"; do
            echo "Verifying $archive..."
            for file in db.sql.gz media.tgz search.tgz; do
              unzip -l "$archive" "$file" | grep -q "$file"
            done
          done