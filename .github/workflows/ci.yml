name: Verify Action
on:
  pull_request:
    # Ignore release-please changed files as they are not relevant to the action
    paths-ignore:
      - .github/workflows/release.yml
      - '**/README.md'
      - CHANGELOG.md
      - .release-please-manifest.json
  push:
    # Ignore release-please changed files as they are not relevant to the action
    paths-ignore:
      - .github/workflows/release.yml
      - '**/README.md'
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Make sure dist is generated from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rm -rf dist/
      - run: npm clean-install
      - run: npm test
      # verify that commit dist directory is exactly the same one generated from source
      - run: npm run build
      - run: git diff --exit-code
      - run: git status --porcelain && test -z "$(git status --porcelain)"
  build-magento:
    name: ${{ format('Builds Magento Artifact ({0}-{1})', matrix.magento-version, case(fromJSON(matrix.sample-data), 'with sample data', 'without sample data') ) }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample-data: ['true', 'false']
        magento-version: ['2.4.9', '2.4.8-p5', '2.4.7-p10']
        include:
          - magento-version: '2.4.9'
            php-version: '8.5'
            mariadb-version: '11.8'
            opensearch-version: '3.0'
          - magento-version: '2.4.8-p5'
            php-version: '8.3'
            mariadb-version: '11.4'
            opensearch-version: '3.0'
          - magento-version: '2.4.7-p10'
            php-version: '8.2'
            mariadb-version: '10.11'
            opensearch-version: '2.19'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          magento-version: ${{ matrix.magento-version }}
          php-version: ${{ matrix.php-version }}
          mariadb-version: ${{ matrix.mariadb-version }}
          opensearch-version: ${{ matrix.opensearch-version }}
          sample-data: ${{ matrix.sample-data }}
          name: ${{ case(fromJSON(matrix.sample-data), format('{0}-sampledata',matrix.magento-version), matrix.magento-version) }}
  build-mage-os:
    name: ${{ format('Builds MageOS Artifact ({0}-{1})', matrix.magento-version, case(fromJSON(matrix.sample-data), 'with sample data', 'without sample data') ) }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample-data: [ 'true', 'false' ]
        magento-version: [ '3.6.0' ]
        include:
          - magento-version: '3.6.0'
            php-version: '8.4'
            mariadb-version: '11.4'
            opensearch-version: '3.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          meta-package: 'mage-os/project-community-edition'
          repository: 'https://repo.mage-os.org/'
          magento-version: ${{ matrix.magento-version }}
          php-version: ${{ matrix.php-version }}
          mariadb-version: ${{ matrix.mariadb-version }}
          opensearch-version: ${{ matrix.opensearch-version }}
          sample-data: ${{ matrix.sample-data }}
          name: mage-os-${{ case(fromJSON(matrix.sample-data), format('{0}-sampledata',matrix.magento-version), matrix.magento-version) }}
  build-multi-stage:
    name: ${{ format('Builds Multi-Stage Magento Artifact ({0}-{1})', matrix.magento-version, case(fromJSON(matrix.sample-data), 'with sample data', 'without sample data') ) }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sample-data: [ 'true', 'false' ]
        magento-version: [ '2.4.9', '2.4.8-p5', '2.4.7-p10' ]
        include:
          - magento-version: '2.4.9'
            php-version: '8.5'
            mariadb-version: '11.8'
            opensearch-version: '3.0'
          - magento-version: '2.4.8-p5'
            php-version: '8.3'
            mariadb-version: '11.4'
            opensearch-version: '3.0'
          - magento-version: '2.4.7-p10'
            php-version: '8.2'
            mariadb-version: '10.11'
            opensearch-version: '2.19'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./build-init
        id: init
        with:
          php-version: ${{ matrix.php-version }}
          mariadb-version: ${{ matrix.mariadb-version }}
          opensearch-version: ${{ matrix.opensearch-version }}
          name: multi-stage-${{ case(fromJSON(matrix.sample-data), format('{0}-sampledata',matrix.magento-version), matrix.magento-version) }}
      - uses: ./build-create-project
        with:
          magento-version: ${{ matrix.magento-version }}
          sample-data: ${{ matrix.sample-data }}
          config-file: ${{ steps.init.outputs.config-file }}
      - uses: ./build-install
        with:
          magento-version: ${{ matrix.magento-version }}
          config-file: ${{ steps.init.outputs.config-file }}
      - uses: ./build-exec
        with:
          config-file: ${{ steps.init.outputs.config-file }}
          command: bin/magento
          command-arguments: |
            list
      - uses: ./build-reindex
        with:
          config-file: ${{ steps.init.outputs.config-file }}
      - uses: ./build-dump
        with:
          config-file: ${{ steps.init.outputs.config-file }}
      - uses: ./build-artifact
        name: Build artifact without custom name
        with:
          config-file: ${{ steps.init.outputs.config-file }}
      - uses: ./build-artifact
        name: Build artifact with custom name
        with:
          config-file: ${{ steps.init.outputs.config-file }}
          name: custom-name-${{ case(fromJSON(matrix.sample-data), format('{0}-sampledata',matrix.magento-version), matrix.magento-version) }}

  verify-artifact:
    name: Verify artifact from build
    needs: [build-magento, build-mage-os, build-multi-stage]
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p verify-artifact
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          skip-decompress: 'true'
          path: ./verify-artifact
      - name: Verify artifact is created
        run: |
          shopt -s nullglob
          archives=(./verify-artifact/**/*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No artifact archives found!"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            echo "Verifying $archive..."
            for file in db.sql.gz media.tgz search.tgz; do
              unzip -l "$archive" "$file" | grep -q "$file"
            done
          done