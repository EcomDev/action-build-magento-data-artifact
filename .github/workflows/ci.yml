name: Verify Dist
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  beacon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm clean-install
      - run: npm test
      # verify that commit dist directory is exactly the same one generated from source
      - run: npm run build
      - run: git diff --exit-code
      - run: git status --porcelain && test -z "$(git status --porcelain)"