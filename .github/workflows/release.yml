name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify-release:
    uses: ./.github/workflows/ci.yml
  release-please:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5